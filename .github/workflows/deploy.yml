name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Project
        run: npm run build

      - name: Compress Build Output
        run: tar -czf dist.tar.gz -C dist .

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload Build Package and Deploy Script
        run: |
          # Upload build package
          scp -o StrictHostKeyChecking=no dist.tar.gz root@${{ secrets.SSH_HOST }}:/tmp/dist.tar.gz
          
          # Upload deploy script
          scp -o StrictHostKeyChecking=no scratch/deploy_vps.sh root@${{ secrets.SSH_HOST }}:/tmp/deploy_vps.sh

      - name: Execute Safe Deployment on VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.SSH_HOST }} "bash /tmp/deploy_vps.sh"
